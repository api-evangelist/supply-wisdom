aid: supply-wisdom
name: Supply Wisdom
description: >-
  Supply Wisdom is a third-party and location risk intelligence SaaS platform that continuously
  monitors suppliers, vendors and operating locations across financial, cyber, compliance, ESG,
  operational, nth-party and geopolitical risk domains. The product is sold in three subscription
  shapes — Real-time Alerts, Comprehensive Intelligence (in-depth reports across 350+ risk metrics
  with 12-month look-back snapshots) and Continuous Monitoring (real-time coverage with AI-driven
  auto actions, configurable dashboards, and email, Slack and webhook notifications) — and is
  positioned to feed an organisation's existing GRC stack rather than replace it, with named
  partnerships into Archer, Aravo, Certa, IBM OpenPages, OneTrust, Black Kite, Fusion Risk
  Management and SecurityScorecard. The platform itself is a tenant application at
  app.supplywisdom.com; no public developer portal, API reference or machine-readable contract is
  published on any Supply Wisdom host.
